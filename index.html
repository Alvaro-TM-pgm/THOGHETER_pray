
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101b2b">

    <title>Missionários em Oração</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- CATÁLOGO -->
        <section id="selecao">

            <h1>ESCOLHA UM MISSIONÁRIO PARA ORAR</h1>

            <div class="catalogo" id="catalogo"></div>

        </section>

        
<!-- PLAYER DE VÍDEO -->
<section id="area-video" class="oculto">

    <button id="voltar" type="button">
        ← Voltar aos missionários
    </button>

    <h2 id="titulo-video"></h2>

    <video id="video-player"
           controls
           playsinline
           preload="metadata">
    </video>

    <p id="erro-video" class="oculto">
        Não foi possível carregar o vídeo.
    </p>

</section>

        <!-- MENSAGEM FINAL -->
        <section id="mensagem-final" class="oculto">

            <div class="mensagem">

                <div class="icone">♡</div>

                <h1>AGORA É A SUA VEZ!</h1>

                <h2 id="nome-final">
                    Ore por este missionário.
                </h2>

                <p>
                    Dedique alguns minutos para conversar com Deus
                    por essa vida e por essa missão.
                </p>

                <p class="frase-final">
                    Sua oração também faz parte dessa obra.
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
